[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent"
version = "0.1.0"
description = "Model-agnostic terminal coding agent (Ollama, vLLM, llama.cpp, LM Studio, in-house LLMs)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "jsonschema>=4.20",
  "httpx>=0.27",
  "jinja2>=3.1",
  "jsonpath-ng>=1.6",
  "mcp>=1.9",
  "PyYAML>=6.0",
  "rich>=13",
  "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.7"]
hf = ["transformers>=4.40"]
dev = [
  "pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "respx>=0.21",
  "hypothesis>=6.100", "ruff>=0.5", "mypy>=1.10", "types-PyYAML",
]

[project.scripts]
agent = "agent.cli:main"

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.setuptools.package-data]
agent = ["prompts/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py", "adapter_contract.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S102", "S307"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["jsonpath_ng.*", "respx.*", "tiktoken.*", "transformers.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["agent"]

[tool.ruff.lint.per-file-ignores]
"evals/tasks.py" = ["E501"]
"tests/fixtures/*" = ["E501"]
