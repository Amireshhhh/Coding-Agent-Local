# Profiles:
#   docker compose --profile ollama run --rm agent-ollama        # Ollama + agent (no internet egress)
#   docker compose --profile vllm   run --rm agent-vllm          # vLLM OpenAI server + agent (GPU)
#   docker compose --profile custom run --rm agent-custom        # agent only -> in-house endpoint
# Mounts the current directory as the project (/work) and ./examples as configs.

x-agent: &agent
  build: .
  image: agent:latest
  stdin_open: true
  tty: true
  working_dir: /work
  volumes:
    - ./:/work
    - ./examples:/configs:ro
    - agent-home:/home/agent/.agent

services:
  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    volumes:
      - ollama-models:/root/.ollama
    networks: [sandbox]

  agent-ollama:
    <<: *agent
    profiles: [ollama]
    depends_on: [ollama]
    environment:
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: ${LLM_MODEL:-qwen2.5-coder:32b}
    command: ["--config", "/configs/ollama-qwen.yaml"]
    networks: [sandbox]

  vllm:
    image: vllm/vllm-openai:latest
    profiles: [vllm]
    command: ["--model", "${VLLM_MODEL:-Qwen/Qwen2.5-Coder-32B-Instruct}", "--enable-auto-tool-choice",
              "--tool-call-parser", "${VLLM_TOOL_PARSER:-hermes}", "--max-model-len", "32768"]
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf-cache:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks: [sandbox, egress]   # needs egress to download weights

  agent-vllm:
    <<: *agent
    profiles: [vllm]
    depends_on: [vllm]
    environment:
      LLM_BASE_URL: http://vllm:8000/v1
      LLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen2.5-Coder-32B-Instruct}
    command: ["--config", "/configs/vllm-llama.yaml"]
    networks: [sandbox]

  agent-custom:
    <<: *agent
    profiles: [custom]
    environment:
      INHOUSE_ENDPOINT: ${INHOUSE_ENDPOINT:-}
      INHOUSE_KEY: ${INHOUSE_KEY:-}
    command: ["--config", "/configs/inhouse-custom-http.yaml"]
    networks: [egress]

networks:
  sandbox:
    internal: true    # no route to the internet: the agent can reach only the model server
  egress: {}

volumes:
  ollama-models: {}
  hf-cache: {}
  agent-home: {}
